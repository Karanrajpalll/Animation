
name: Build ToonStudioMobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          unzip -o jiopoli.zip -d extracted

          PROJECT_FILE=$(find extracted -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted -type f \
              -name settings.gradle -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToonStudioMobile-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
